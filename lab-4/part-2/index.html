<body>
  <h1>Image gallery example</h1>

  <div
    class="full-img"
    style="position: relative; width: 640px; height: 480px"
  >
    <img
      class="displayed-img"
      src="https://mdn.github.io/shared-assets/images/examples/learn/gallery/pic1.jpg"
      alt="Closeup of a human eye"
    />
    <div
      class="overlay"
      style="
          position: absolute;
          width: 100%;
          height: 100%;
          top: 0;
          left: 0;
        "
    ></div>
    <button
      class="dark"
      style="position: absolute; top: 0"
    >
      Darken
    </button>
  </div>

  <div
    class="thumb-bar"
    style="width: 640px; display: flex; gap: 3px; margin-top: 2px"
  ></div>
</body>
