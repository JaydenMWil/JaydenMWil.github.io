<h1>Planet data table</h1>

<table>
  <caption>
    Data about the planets of our solar system
    (Planetary facts taken from<a href="http://nssdc.gsfc.nasa.gov/planetary/factsheet/">Nasa's Planetary Fact Sheet - Metric</a>).
  </caption>

  <thead>
    <tr>
      <td colspan="2"></td>
      <td>Name</td>
      <td>Mass (10<sup>24</sup>kg)</td>
      <td>Diameter (km)</td>
      <td>Density (kg/m<sup>3</sup>)</td>
      <td>Gravity (m/s<sup>2</sup>)</td>
      <td>Length of day (hours)</td>
      <td>Distance from Sun (10<sup>6</sup>km)</td>
      <td>Mean temperature (°C)</td>
      <td>Number of moons</td>
      <td>Notes</td>
    </tr>
  </thead>

  </tbody>
  
</table>
